# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.6)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog diffs against the previous tag — needs full history.
          fetch-depth: 0
      - name: Generate and publish DeepSeek V4.1 Flash release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: deepseek-v4.1-flash
          OPENCODE_MAX_TOKENS: "16000"
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its AI notes unchanged."
            exit 0
          fi
          node scripts/rolling-notes.mjs --channel release --repo "$GITHUB_REPOSITORY" --require-ai > ai-notes.md
          # Notes are built into a file rather than passed as a multi-line
          # --notes string: inside a `run: |` block scalar EVERY line must stay
          # indented, and a quoted string continuing at column 0 silently ends
          # the block and makes the whole workflow file invalid.
          {
            printf 'Built from commit `%s`.\n\n' "${GITHUB_SHA:0:7}"
            cat ai-notes.md
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest --notes-file release-notes.md
          else
            gh release create "$TAG" --latest --title "ryu-predict $TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi

  build:
    needs: notes
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config
      # The app's unit/integration tests ship WITH the satellite (colocated in
      # backend/src + backend/tests), so the satellite gates its own artifact.
      # Keep tests in the debug profile: hermetic loopback fixtures exercise the
      # explicitly development-only HTTP path, while the following build still
      # compiles the shipped artifact with --release.
      - name: Test
        run: cargo test --manifest-path Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path Cargo.toml
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          case "${{ runner.os }}" in
            Linux)   plat="linux-x86_64" ;;
            macOS)   plat="macos-aarch64" ;;
            Windows) plat="windows-x86_64" ;;
          esac
          mkdir -p dist
          cp "target/release/ryu-predict${ext}" "dist/ryu-predict-${plat}${ext}"
          if [ "predict" = "backend-ui" ] && [ -f dist/index.html ]; then
            tar -czf "dist/ryu-predict-ui-${plat}.tar.gz" -C dist index.html
          fi
          ( cd dist
            for f in "ryu-predict-${plat}${ext}" ryu-predict-ui-${plat}.tar.gz; do
              [ -f "$f" ] || continue
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$f" > "$f.sha256"; fi
            done )
      # gh release upload, NOT softprops: softprops PATCHes the release even
      # when it is only ADDING assets, and that PATCH is refused for the App
      # token ("Resource not accessible by integration") despite Contents:
      # write. The assets endpoint on its own is permitted.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
